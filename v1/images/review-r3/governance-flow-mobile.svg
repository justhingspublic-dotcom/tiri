<svg xmlns="http://www.w3.org/2000/svg" width="360" height="692" viewBox="0 0 360 692"><title>提升公司治理服務流程</title><rect width="360" height="692" fill="#faf9fb"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#846791"/></marker></defs><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="16" y="35" font-size="19" font-weight="600" fill="#503660">提升公司治理服務流程</text><path d="M16 53H344" stroke="#d9cedf"/><path d="M180 148v17" stroke="#846791" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="16" y="72" width="328" height="76" fill="white" stroke="#cfc0d7"/><rect x="16" y="72" width="50" height="76" fill="#ede5f1"/><text x="41" y="118" text-anchor="middle" font-size="20" fill="#59396b">01</text><text x="82" y="117" font-size="18" fill="#29232e">受輔導公司提出申請</text><path d="M180 248v17" stroke="#846791" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="16" y="172" width="328" height="76" fill="white" stroke="#cfc0d7"/><rect x="16" y="172" width="50" height="76" fill="#ede5f1"/><text x="41" y="218" text-anchor="middle" font-size="20" fill="#59396b">02</text><text x="82" y="217" font-size="18" fill="#29232e">受輔導公司提交所需文件</text><path d="M180 348v17" stroke="#846791" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="16" y="272" width="328" height="76" fill="white" stroke="#cfc0d7"/><rect x="16" y="272" width="50" height="76" fill="#ede5f1"/><text x="41" y="318" text-anchor="middle" font-size="20" fill="#59396b">03</text><text x="82" y="317" font-size="18" fill="#29232e">協會評估受輔導公司現況</text><path d="M180 448v17" stroke="#846791" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="16" y="372" width="328" height="76" fill="white" stroke="#cfc0d7"/><rect x="16" y="372" width="50" height="76" fill="#ede5f1"/><text x="41" y="418" text-anchor="middle" font-size="20" fill="#59396b">04</text><text x="82" y="417" font-size="18" fill="#29232e">至受輔導公司訪談</text><path d="M180 548v17" stroke="#846791" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="16" y="472" width="328" height="76" fill="white" stroke="#cfc0d7"/><rect x="16" y="472" width="50" height="76" fill="#ede5f1"/><text x="41" y="518" text-anchor="middle" font-size="20" fill="#59396b">05</text><text x="82" y="517" font-size="18" fill="#29232e">協會提出治理提升策略及規劃</text><rect x="16" y="572" width="328" height="76" fill="white" stroke="#cfc0d7"/><rect x="16" y="572" width="50" height="76" fill="#ede5f1"/><text x="41" y="618" text-anchor="middle" font-size="20" fill="#59396b">06</text><text x="82" y="617" font-size="18" fill="#29232e">提供後續諮詢服務</text></g></svg>
{% extends "base.html" %}
{% block title %}帳號設定{% endblock %}
{% block page_title %}帳號設定{% endblock %}

{% block extra_css %}
<style>
    .set-field .b-label { display: block; margin-bottom: 5px; }
    .set-field .hint { margin-top: 5px; font-size: 12.5px; color: var(--text-body-subtle); }
    .b-btn.b-btn-text:disabled { background: transparent; color: var(--fg-disabled, var(--text-body-subtle)); cursor: default; }
    .pw-wrap { position: relative; }
    .pw-wrap .b-input { padding-right: 42px; }
    .pw-eye {
        position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
        width: 30px; height: 30px; display: grid; place-content: center;
        border: 0; background: transparent; border-radius: 6px;
        color: var(--text-body-subtle); cursor: pointer;
    }
    .pw-eye:hover { color: var(--text-heading); background: var(--neutral-secondary-medium); }
    .pw-eye:focus-visible { outline: none; box-shadow: 0 0 0 4px var(--brand-medium); }
    .pw-eye svg { width: 16px; height: 16px; }
</style>
{% endblock %}

{% block content %}
<form method="post" action="/admin/account">
    <div class="grid grid-cols-2 gap-6">

        <section class="b-card flex flex-col" style="overflow:hidden;">
            <div class="b-card-head"><h2 class="b-card-title">基本資料</h2></div>
            <div class="b-card-body flex-1 grid gap-y-5 content-start">
                <div class="set-field">
                    <label class="b-label" for="acc-email">帳號 Email</label>
                    <input type="text" id="acc-email" class="b-input" value="{{ admin_email }}" disabled>
                    <div class="hint">登入帳號，不可變更</div>
                </div>
                <div class="set-field">
                    <label class="b-label" for="nickname">暱稱</label>
                    <input type="text" id="nickname" name="nickname" class="b-input" value="{{ nickname }}">
                    <div class="hint">顯示在右上角帳號選單</div>
                </div>
            </div>
        </section>

        <section class="b-card" style="overflow:hidden;">
            <div class="b-card-head"><h2 class="b-card-title">變更密碼</h2></div>
            <div class="b-card-body grid gap-y-5">
                <div class="set-field">
                    <label class="b-label" for="new_password">新密碼</label>
                    <div class="pw-wrap">
                        <input type="password" id="new_password" name="new_password" class="b-input"
                               value="" placeholder="至少 8 個字元" autocomplete="new-password">
                        <button type="button" class="pw-eye" data-eye="new_password" aria-label="顯示密碼" aria-pressed="false"><i data-lucide="eye" aria-hidden="true"></i></button>
                    </div>
                    <div class="hint">留空＝不變更密碼</div>
                </div>
                <div class="set-field">
                    <label class="b-label" for="new_password2">確認新密碼</label>
                    <div class="pw-wrap">
                        <input type="password" id="new_password2" name="new_password2" class="b-input"
                               value="" autocomplete="new-password">
                        <button type="button" class="pw-eye" data-eye="new_password2" aria-label="顯示密碼" aria-pressed="false"><i data-lucide="eye" aria-hidden="true"></i></button>
                    </div>
                </div>
            </div>
        </section>

    </div>
    {# 兩張卡同屬一張表單：儲存鈕放整個表單右下角，一顆存全部（暱稱＋密碼） #}
    <div class="flex justify-end" style="margin-top: 16px;">
        <button id="save-btn" class="b-btn b-btn-text" type="submit" disabled>儲存變更</button>
    </div>
</form>
{% endblock %}

{% block extra_js %}
<script>
    (function () {
        var form = document.querySelector('form[action="/admin/account"]');
        var save = document.getElementById('save-btn');
        function snap() {
            return Array.prototype.filter.call(form.elements, function (el) { return el.name; })
                .map(function (el) { return el.name + '=' + el.value; })
                .join('&');
        }
        var baseline = snap();
        function update() { save.disabled = (snap() === baseline); }
        form.addEventListener('input', update);
        form.addEventListener('change', update);
    })();

    /* 密碼欄眼睛：切換顯示/隱藏（動態換 icon 後要重呼 lucide — kit 已知坑） */
    document.querySelectorAll('[data-eye]').forEach(function (btn) {
        var input = document.getElementById(btn.getAttribute('data-eye'));
        if (!input) return;
        btn.addEventListener('click', function () {
            var show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            btn.setAttribute('aria-pressed', show ? 'true' : 'false');
            btn.setAttribute('aria-label', show ? '隱藏密碼' : '顯示密碼');
            btn.innerHTML = '<i data-lucide="' + (show ? 'eye-off' : 'eye') + '" aria-hidden="true"></i>';
            window.renderLucideIcons();
        });
    });
</script>
{% endblock %}

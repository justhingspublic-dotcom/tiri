{# TIRI 收件後台登入 — 依 backend-design uikit login.html 移植 #}
<!DOCTYPE html>
<html lang="zh-Hant" data-color-mode="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <title>後台登入 - TIRI 台灣投資人關係協會</title>
    <script>
        (function () {
            try {
                if (localStorage.getItem('bAdminColorMode') === 'dark') {
                    document.documentElement.setAttribute('data-color-mode', 'dark');
                }
            } catch (e) { }
        })();
    </script>
    <link rel="stylesheet" href="/static/css/cms/b_tokens.css?v=20260727a">
    <link rel="stylesheet" href="/static/css/brand.css?v=20260727g">
    <link rel="stylesheet" href="/static/css/cms/b_admin.css?v=20260727d">
    <link rel="stylesheet" href="/static/css/cms/login.css?v=20260727a">
    <style>
        /* 現階段測試用：快速登入鈕（正式上線移除此按鈕即可） */
        .quick-login-btn {
            width: 100%; margin-top: 10px; display: inline-flex; align-items: center;
            justify-content: center; gap: 8px; padding: 11px 16px; border-radius: 10px;
            border: 1px solid var(--border-brand); background: var(--brand-softer);
            color: var(--fg-brand); font-size: 14px; font-weight: 600; cursor: pointer;
            font-family: inherit; transition: background .15s ease;
        }
        .quick-login-btn:hover { background: var(--brand-soft); }
        .quick-login-btn svg { width: 16px; height: 16px; }
        /* 前台同款橫式 wordmark：放寬 kit 預設的 60px 方形 mark */
        .login-mark { width: auto; flex-basis: auto; height: 54px; }
        .login-mark img { height: 100%; width: auto; }
        [data-color-mode="dark"] .login-mark img { filter: invert(1) hue-rotate(180deg); }
    </style>
</head>
<body class="login-body">
    <div class="login-page is-course">
        <main class="login-shell" aria-label="TIRI 後台登入">
            <section class="login-panel" aria-label="登入表單">
                <div class="login-panel-head">
                    <div class="login-card-brand">
                        <div class="login-mark" aria-hidden="false">
                            <img src="/static/tiri-logo.png?v=20260727a" alt="TIRI 標誌">
                        </div>
                        <h1 class="login-brand-title">台灣投資人關係協會</h1>
                        <p class="login-brand-sub">表單收件後台</p>
                    </div>
                </div>

                {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                <div class="login-alert" role="alert">
                    <i data-lucide="circle-alert" aria-hidden="true"></i>
                    <span>{{ message }}</span>
                </div>
                {% endfor %}
                {% endwith %}

                <form method="post" action="/admin/login" class="login-form">
                    <div class="form-group">
                        <label class="form-label" for="login-email">
                            <i data-lucide="mail" aria-hidden="true"></i>
                            帳號 Email
                        </label>
                        <input id="login-email"
                               name="email"
                               type="email"
                               class="form-input"
                               placeholder="you@example.com"
                               required
                               autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="login-password">
                            <i data-lucide="lock-keyhole" aria-hidden="true"></i>
                            密碼
                        </label>
                        <div class="password-wrapper">
                            <input id="login-password"
                                   name="password"
                                   type="password"
                                   class="form-input"
                                   placeholder="請輸入密碼"
                                   required
                                   autocomplete="current-password"
                                   style="padding-right: 44px;">
                            <button type="button"
                                    class="login-password-toggle"
                                    data-password-toggle="login-password"
                                    aria-label="顯示密碼"
                                    aria-pressed="false">
                                <i data-lucide="eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-login">
                        <i data-lucide="log-in" aria-hidden="true"></i>
                        <span>登入</span>
                    </button>

                    <button type="button" class="quick-login-btn" id="quick-login">
                        <i data-lucide="zap" aria-hidden="true"></i>
                        <span>快速登入（office@tiri.tw）</span>
                    </button>
                </form>
            </section>
        </main>

        <p class="login-copyright">&copy; 2026 台灣投資人關係協會</p>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        function refreshLoginIcons() {
            if (window.lucide) {
                window.lucide.createIcons({ attrs: { 'stroke-width': 2.2, 'aria-hidden': 'true' } });
            }
        }

        document.querySelectorAll('[data-password-toggle]').forEach(function (button) {
            var input = document.getElementById(button.getAttribute('data-password-toggle'));
            if (!input) return;
            button.addEventListener('click', function () {
                var show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                button.setAttribute('aria-pressed', show ? 'true' : 'false');
                button.setAttribute('aria-label', show ? '隱藏密碼' : '顯示密碼');
                button.innerHTML = '<i data-lucide="' + (show ? 'eye-off' : 'eye') + '" aria-hidden="true"></i>';
                refreshLoginIcons();
            });
        });

        /* 快速登入：帶入測試帳密直接送出 */
        document.getElementById('quick-login').addEventListener('click', function () {
            document.getElementById('login-email').value = 'office@tiri.tw';
            document.getElementById('login-password').value = 'tiri1234';
            document.querySelector('.login-form').submit();
        });

        refreshLoginIcons();
    </script>
</body>
</html>

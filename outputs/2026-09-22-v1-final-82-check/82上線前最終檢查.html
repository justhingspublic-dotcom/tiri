<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>TIRI v1｜82 上線前最終檢查</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17131d;
      --muted: #6d6674;
      --line: #e5dfe8;
      --surface: #fff;
      --wash: #f6f3f8;
      --purple: #5d167f;
      --purple-soft: #eee3f3;
      --green: #176c46;
      --green-soft: #e8f5ed;
      --orange: #a85114;
      --orange-soft: #fff0e3;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--wash);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      line-height: 1.7;
    }
    button, textarea { font: inherit; }
    a { color: inherit; }
    .shell { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 72px; }
    .hero {
      padding: 36px;
      border-radius: 26px;
      color: #fff;
      background: linear-gradient(135deg, #21102b 0%, #5d167f 58%, #8738a8 100%);
      box-shadow: 0 24px 60px rgba(57, 21, 73, .18);
    }
    .eyebrow { margin: 0 0 8px; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; opacity: .74; }
    h1 { margin: 0; font-size: clamp(31px, 5vw, 56px); line-height: 1.12; letter-spacing: -.04em; }
    .intro { max-width: 790px; margin: 14px 0 0; color: rgba(255,255,255,.8); }
    .summary { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 20px; }
    .summary span { padding: 5px 11px; border: 1px solid rgba(255,255,255,.24); border-radius: 999px; color: rgba(255,255,255,.9); font-size: 13px; }
    .progress { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: end; margin-top: 28px; }
    .progress-track { height: 8px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.2); }
    .progress-bar { width: 0; height: 100%; border-radius: inherit; background: #fff; transition: width .2s ease; }
    .progress strong { font-size: 27px; line-height: 1; }
    .toolbar { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin: 28px 0 16px; }
    .toolbar p { margin: 0; color: var(--muted); }
    .toolbar-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .button {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 16px;
      color: var(--ink);
      background: var(--surface);
      cursor: pointer;
    }
    .button:hover { border-color: var(--purple); color: var(--purple); }
    .group { margin-top: 30px; }
    .group-head { display: flex; justify-content: space-between; gap: 16px; align-items: end; margin: 0 2px 12px; }
    .group-head h2 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
    .group-head p { margin: 0; color: var(--muted); font-size: 14px; }
    .list { display: grid; gap: 14px; }
    .item {
      display: grid;
      grid-template-columns: 58px minmax(0,1fr) 238px;
      gap: 22px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(32, 19, 39, .045);
    }
    .item.is-done { border-color: #b7dcc6; background: linear-gradient(90deg, var(--green-soft), #fff 34%); }
    .number { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 15px; color: var(--purple); background: var(--purple-soft); font-weight: 750; }
    .item h3 { margin: 0; font-size: 21px; line-height: 1.35; }
    .meta { display: inline-flex; margin-top: 7px; padding: 2px 8px; border-radius: 999px; color: var(--orange); background: var(--orange-soft); font-size: 12px; font-weight: 700; }
    .change { margin: 8px 0 0; color: #4c4652; }
    .check { margin: 12px 0 0; padding-left: 16px; border-left: 3px solid #c8a6d8; color: var(--muted); font-size: 14px; }
    .actions { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
    .open { display: block; padding: 10px 14px; border-radius: 12px; color: var(--purple); background: var(--purple-soft); text-align: center; text-decoration: none; font-weight: 680; }
    .open:hover { background: #e4d2ed; }
    .confirm { display: flex; gap: 9px; align-items: flex-start; cursor: pointer; font-size: 14px; font-weight: 680; }
    .confirm input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--green); }
    textarea { width: 100%; min-height: 76px; resize: vertical; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; color: var(--ink); background: #fff; }
    textarea:focus { outline: 2px solid #d6b4e5; border-color: var(--purple); }
    .save { margin: 18px 2px 0; color: var(--muted); font-size: 13px; }
    .footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px; align-items: center; margin-top: 22px; padding: 20px 2px; color: var(--muted); }
    .footer p { margin: 0; }
    @media (max-width: 780px) {
      .shell { width: min(100% - 20px, 640px); padding-top: 10px; }
      .hero { padding: 26px 22px; border-radius: 18px; }
      .progress { grid-template-columns: 1fr; gap: 10px; }
      .toolbar, .group-head { align-items: flex-start; flex-direction: column; }
      .item { grid-template-columns: 44px minmax(0,1fr); gap: 14px; padding: 18px 16px; border-radius: 16px; }
      .number { width: 40px; height: 40px; }
      .actions { grid-column: 1 / -1; }
      .item h3 { font-size: 18px; }
      .footer { align-items: stretch; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">

      <h1>82 上線前最終檢查</h1>

      <div class="summary"><span>9/21：19 項</span><span>9/22：6 項</span><span>全部：25 項</span></div>
      <div class="progress">
        <div class="progress-track" aria-hidden="true"><div class="progress-bar" id="progress-bar"></div></div>
        <strong><span id="done-count">0</span> / 25</strong>
      </div>
    </header>

    <div class="toolbar">

        <button class="button" id="export" type="button">匯出檢查結果 ↓</button>

    </div>

    <div id="groups"></div>

    <p class="save" id="save-status">勾選與備註會自動儲存在目前瀏覽器。</p>
    <footer class="footer">
      <p>完成全部 25 項後，再把 v1 放回 82。</p>
      <button class="button" id="export-bottom" type="button">匯出檢查結果 ↓</button>
    </footer>
  </main>

            },

      const version = 'tiri-v1-final-82-check-20260922-v1';
      const key = version;
      const root = document.getElementById('groups');

      groups.forEach(group => {
        const section = document.createElement('section');
        section.className = 'group';
        section.innerHTML = `<div class="group-head"><div><p class="eyebrow">${group.date}</p><h2>${group.label}</h2></div><p>${group.note}</p></div><div class="list"></div>`;
        const list = section.querySelector('.list');
        group.items.forEach(data => {
          const article = document.createElement('article');
          article.className = 'item';
          article.dataset.id = data.id;
          article.dataset.date = group.date;
          article.innerHTML = `
            <span class="number">${data.id}</span>
            <div>
              <h3>${data.title}</h3>
              <span class="meta">${group.date}</span>
              <p class="change">${data.change}</p>
              <p class="check">請檢查：${data.check}</p>
            </div>
            <div class="actions">
              <a class="open" href="${data.href}" target="_blank" rel="noopener">開啟頁面檢查 ↗</a>
              <label class="confirm"><input type="checkbox">這項通過</label>
              <textarea aria-label="第 ${data.id} 項檢查備註" placeholder="需要再改的地方"></textarea>
            </div>`;
          list.appendChild(article);
        });
        root.appendChild(section);
      });

      const items = [...document.querySelectorAll('.item')];
      let records = {};
      try { records = JSON.parse(localStorage.getItem(key) || '{}'); } catch (_) {}

      function save() {
        try {
          localStorage.setItem(key, JSON.stringify(records));
          document.getElementById('save-status').textContent = '已自動儲存 · ' + new Date().toLocaleTimeString('zh-TW');
        } catch (_) {
          document.getElementById('save-status').textContent = '瀏覽器無法儲存，請使用匯出按鈕保留結果。';
        }
      }

      function refresh() {
        const done = items.filter(item => item.querySelector('input').checked).length;
        document.getElementById('done-count').textContent = done;
        document.getElementById('progress-bar').style.width = (done / items.length * 100) + '%';
        document.getElementById('status').textContent = done === items.length ? '25 項全部通過，可以放回 82' : `尚有 ${items.length - done} 項待檢查`;
        items.forEach(item => item.classList.toggle('is-done', item.querySelector('input').checked));
      }

      items.forEach(item => {
        const id = item.dataset.id;
        const checkbox = item.querySelector('input');
        const note = item.querySelector('textarea');
        checkbox.checked = records[id]?.confirmed === true;
        note.value = records[id]?.note || '';
        checkbox.addEventListener('change', () => {
          records[id] = { ...records[id], confirmed: checkbox.checked, note: note.value, updatedAt: new Date().toISOString() };
          save();
          refresh();
        });
        note.addEventListener('input', () => {
          records[id] = { ...records[id], confirmed: checkbox.checked, note: note.value, updatedAt: new Date().toISOString() };
          save();
        });
      });

      function exportResults() {
        const flat = groups.flatMap(group => group.items.map(item => ({ ...item, date: group.date })));
        const result = {
          version,
          title: 'TIRI v1｜82 上線前最終檢查',
          exportedAt: new Date().toISOString(),
          summary: {
            total: items.length,
            confirmed: items.filter(item => item.querySelector('input').checked).length,
            pending: items.filter(item => !item.querySelector('input').checked).length
          },
          items: items.map((item, index) => ({
            id: item.dataset.id,
            date: item.dataset.date,
            title: flat[index].title,
            page: flat[index].href,
            confirmed: item.querySelector('input').checked,
            note: item.querySelector('textarea').value,
            updatedAt: records[item.dataset.id]?.updatedAt || null
          }))
        };
        const blob = new Blob([JSON.stringify(result, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'TIRI-v1-82上線前最終檢查結果.json';
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      document.getElementById('export').addEventListener('click', exportResults);
      document.getElementById('export-bottom').addEventListener('click', exportResults);
      document.getElementById('reset').addEventListener('click', () => {
        if (!window.confirm('確定要清除這份最終檢查的全部勾選與備註嗎？')) return;
        records = {};
        localStorage.removeItem(key);
        items.forEach(item => {
          item.querySelector('input').checked = false;
          item.querySelector('textarea').value = '';
        });
        document.getElementById('save-status').textContent = '已清除全部紀錄。';
        refresh();
      });

      refresh();
    })();
  </script>
</body>
</html>

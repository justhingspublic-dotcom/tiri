<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico?v=20260724" type="image/x-icon">
<title>TIRI 台灣投資人關係協會</title>
<meta name="robots" content="noindex">
<style>
  /* 跨頁轉場主線：與站內同為 View Transitions，splash 淡出後由瀏覽器
     crossfade 進首頁內容，中間不落白畫面；不支援的瀏覽器走首頁的 page-in 備援 */
  @view-transition { navigation: auto; }
  ::view-transition-old(root),
  ::view-transition-new(root) {
    animation-duration: 0.42s;
    animation-timing-function: cubic-bezier(0.25, 1, 0.33, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    ::view-transition-old(root),
    ::view-transition-new(root) { animation: none !important; }
  }
  html { background: #ffffff; height: 100%; }
  body { height: 100%; }
  body {
    margin: 0;
    background: #ffffff;
    display: grid;
    place-items: center;
    transition: opacity 0.34s cubic-bezier(0.25, 1, 0.33, 1);
  }
  html.is-leaving body { opacity: 0; }
  img {
    width: min(190px, 44vw);
    height: auto;
    opacity: 0;
    transform: scale(0.985);
    animation: logo-in 0.5s cubic-bezier(0.25, 1, 0.33, 1) 0.08s forwards;
  }
  @keyframes logo-in { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    img { animation: none; opacity: 1; transform: none; }
    body { transition: none; }
  }
  .skip { position: absolute; left: -9999px; }
</style>
<noscript><meta http-equiv="refresh" content="1; url=html/index.html"></noscript>
</head>
<body>
<img src="images/tiri-logo.png" alt="TIRI 台灣投資人關係協會" width="1100" height="649">
<a class="skip" href="html/index.html">進入網站</a>
<script>
  setTimeout(function () { document.documentElement.classList.add("is-leaving"); }, 900);
  setTimeout(function () { location.replace("html/index.html"); }, 1240);
  window.addEventListener("pageshow", function () {
    document.documentElement.classList.remove("is-leaving");
  });
</script>
</body>
</html>
